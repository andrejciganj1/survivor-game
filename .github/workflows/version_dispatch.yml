name: Version Dispatch Workflow

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number to process'
        required: true
        type: string

jobs:
  process-version:
    runs-on: ubuntu-latest
    steps:
      - name: Echo Version
        run: |
          echo "Received version: ${{ github.event.inputs.version }}"
      - name: Save Version as Artifact
        run: |
          echo "${{ github.event.inputs.version }}" > version.txt
      - name: Upload Version Artifact
        uses: actions/upload-artifact@v4
        with:
          name: version-artifact
          path: version.txt
