name: Version Dispatch Workflow

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number to process'
        required: true
        type: string

jobs:
  process-version:
    runs-on: ubuntu-latest
    steps:
      - name: Echo Version
        run: echo "Received version: ${{ github.event.inputs.version }}"
      - name: Trigger Next Workflow
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/echo_version.yml/dispatches \
          -d '{"ref":"${{ github.ref }}","inputs":{"version":"${{ github.event.inputs.version }}"}}'
