name: Echo Version Workflow

on:
  workflow_run:
    workflows: ["Version Dispatch Workflow"]
    types:
      - completed

jobs:
  echo-version:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Debug Workflow Run Context
        run: |
          echo "Triggered by workflow run ID: ${{ github.event.workflow_run.id }}"
      - name: Download Version Artifact
        uses: actions/download-artifact@v4
        with:
          name: version-artifact
      - name: List Downloaded Files
        run: ls -l
      - name: Read and Echo Version
        run: |
          VERSION=$(cat version.txt)
          echo "Echoing version: $VERSION"
