name: Echo Version Workflow

on:
  workflow_run:
    workflows: ["Version Dispatch Workflow"]
    types:
      - completed

jobs:
  echo-version:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Echo version from repository variable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(gh variable get WORKFLOW_VERSION --repo ${{ github.repository }})
          echo "Version from previous workflow: $VERSION"
        shell: bash
